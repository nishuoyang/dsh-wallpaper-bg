<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>dsh-wallpaper-engine-api</title>
  <defs>
    <linearGradient id="weapi-bg" x1="4" y1="3" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#2E3FB8"/>
    </linearGradient>
    <linearGradient id="weapi-screen" x1="8" y1="8" x2="28" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9D1FF"/>
      <stop offset="1" stop-color="#4E7CFF"/>
    </linearGradient>
  </defs>
  <!-- 底：插件卡片 -->
  <rect x="3" y="3" width="30" height="30" rx="8" fill="url(#weapi-bg)"/>
  <!-- 屏幕：壁纸库 -->
  <rect x="7.5" y="8" width="21" height="14.5" rx="2.6" fill="url(#weapi-screen)"/>
  <!-- 播放符号：壁纸 / 媒体 -->
  <path d="M15.1 11.4 L20.8 15.25 L15.1 19.1 Z" fill="#FFFFFF" fill-opacity="0.96"/>
  <!-- 波浪：音频 / 动态壁纸 -->
  <path d="M11.4 20.1c1.05-1.3 2.1-1.3 3.15 0s2.1 1.3 3.15 0 2.1-1.3 3.15 0"
        stroke="#0E1633" stroke-opacity="0.5" stroke-width="1.35" stroke-linecap="round"/>
  <!-- 底座 -->
  <rect x="15.6" y="23.1" width="4.8" height="1.9" rx="0.95" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="12.4" y="25.4" width="11.2" height="1.6" rx="0.8" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- API 运行指示灯 -->
  <circle cx="28.2" cy="28.2" r="3.15" fill="#3BE0A0" stroke="#1A2360" stroke-width="1.15"/>
</svg>

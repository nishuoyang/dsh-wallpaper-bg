<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>dsh-wallpaper-bg</title>
  <defs>
    <linearGradient id="wbg-front" x1="5" y1="5" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C8BFF"/>
      <stop offset="1" stop-color="#3A54E0"/>
    </linearGradient>
    <linearGradient id="wbg-back" x1="14" y1="14" x2="31" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B8CFF"/>
      <stop offset="1" stop-color="#5A46E0"/>
    </linearGradient>
    <clipPath id="wbg-clip">
      <rect x="5" y="5" width="21" height="21" rx="5.2"/>
    </clipPath>
  </defs>
  <!-- 后层：壁纸层（多来源 / 可叠加的暗示） -->
  <rect x="13.5" y="13.5" width="17" height="17" rx="4.5" fill="url(#wbg-back)"/>
  <!-- 前层：壁纸卡片：远景（天空 + 太阳 + 山脊） -->
  <rect x="5" y="5" width="21" height="21" rx="5.2" fill="url(#wbg-front)"/>
  <g clip-path="url(#wbg-clip)">
    <circle cx="13.8" cy="12.4" r="2.9" fill="#FFD98A"/>
    <path d="M5 26 L12.6 16.6 L17.4 21.8 L21.8 18.6 L26 23.2 V26 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
</svg>
